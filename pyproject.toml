[tool.poetry]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = ["Petr Maev <petr.maev94@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"


[tool.poetry.group.dev.dependencies]
django = "^5.2.4"
djangorestframework = "^3.16.0"
psycopg2 = "^2.9.10"
ipython = "^9.4.0"
python-dotenv = "^1.1.1"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.10.1"
drf-yasg = "^1.21.10"
celery = "^5.5.3"
eventlet = "^0.40.2"
redis = "^6.2.0"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# Максимальная длина строки
line_length = 119
